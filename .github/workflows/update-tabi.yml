name: Update tabi theme

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * 1"  # Weekly on Mondays at 5 past midnight UTC

jobs:
  update-tabi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check for updates
        id: check
        run: |
          cd themes/tabi
          CURRENT=$(git rev-parse HEAD)
          git fetch origin main
          git checkout origin/main
          NEW=$(git rev-parse HEAD)
          if [ "$CURRENT" != "$NEW" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "old_version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          fi
          cd ../..

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        run: |
          # Create branch
          BRANCH="update-tabi-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          # Commit changes
          git add themes/tabi
          git commit -m "Update tabi theme to ${NEW_VERSION:0:7}"

          git push origin "$BRANCH"

          # Write PR body to file
          printf 'Updating `themes/tabi` from [%s](https://github.com/welpo/tabi/commit/%s) to [%s](https://github.com/welpo/tabi/commit/%s).\n\n[Review upstream changes](https://github.com/welpo/tabi/compare/%s...%s).\n' \
            "${OLD_VERSION:0:7}" "$OLD_VERSION" "${NEW_VERSION:0:7}" "$NEW_VERSION" \
            "$OLD_VERSION" "$NEW_VERSION" > pr_body.md

          gh pr create \
            --head "$BRANCH" \
            --title "Update tabi theme to ${NEW_VERSION:0:7}" \
            --body-file pr_body.md

          rm pr_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_VERSION: ${{ steps.check.outputs.old_version }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
